apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: cv-veileder
  namespace: teampam
  labels:
    team: teampam
spec:
  port: 8095
  liveness:
    path: /min-cv/api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /min-cv/api/internal/isReady
    initialDelay: 10
  replicas:
    min: 2
    max: 2
    scalingStrategy:
      cpu:
        thresholdPercentage: 50
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  vault:
    enabled: false
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        extra:
          - NAVident
    sidecar:
      enabled: true
      autoLogin: true
  tokenx:
    enabled: true
  prometheus:
    enabled: true
    path: /min-cv/api/internal/metrics
  filesFrom:
    - emptyDir:
        medium: Memory
      mountPath: /app/.next/cache
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
        - id: elastic
  env:
    - name: ER_VEILEDER
      value: "true"
    - name: PORT
      value: "8095"
    - name: PAM_CV_API_BASEURL
      value: http://pam-cv-api-gcp/pam-cv-api/rest
    - name: MODIA_DEKORATOR_BASEURL
      value: http://modiacontextholder.personoversikt/api
    - name: PAM_ONTOLOGI_BASEURL
      value: http://pam-ontologi/rest/typeahead
    - name: PAM_EURES_CV_EKSPORT_BASEURL
      value: http://pam-eures-cv-eksport/pam-eures-cv-eksport/samtykke
  accessPolicy:
    outbound:
      rules:
        - application: modiacontextholder
          namespace: personoversikt
        - application: pam-cv-api-gcp
        - application: pam-ontologi
